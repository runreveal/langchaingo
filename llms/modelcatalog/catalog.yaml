  - id: claude-opus-4-8
    match: [claude-opus-4-8]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 5, output: 25}
  - id: claude-opus-4-7
    match: [claude-opus-4-7]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 5, output: 25}
  # The 4.6 models still accept budget_tokens, but it is deprecated there.
  - id: claude-opus-4-6
    match: [claude-opus-4-6]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, max]}
    temperature: true
    pricing: {input: 5, output: 25}
  - id: claude-sonnet-4-6
    match: [claude-sonnet-4-6]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, max]}
    temperature: true
    pricing: {input: 3, output: 15}
  - id: claude-opus-4-5
    match: [claude-opus-4-5]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 64000
    reasoning: {style: budget_tokens}
    temperature: true
    pricing: {input: 5, output: 25}
  # Opus 4 and 4.1, at the legacy Opus rate.
  - id: claude-opus-4
    match: [claude-opus-4]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 32000
    reasoning: {style: budget_tokens}
    temperature: true
    pricing: {input: 15, output: 75}
  - id: claude-sonnet-4-5
    match: [claude-sonnet-4-5]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 64000
    reasoning: {style: budget_tokens}
    temperature: true
    pricing: {input: 3, output: 15}
  - id: claude-sonnet-4
    match: [claude-sonnet-4]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 64000
    reasoning: {style: budget_tokens}
    temperature: true
    pricing: {input: 3, output: 15}
  - id: claude-haiku-4-5
    match: [claude-haiku-4-5]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 64000
    reasoning: {style: budget_tokens}
    temperature: true
    pricing: {input: 1, output: 5}

  # --- Anthropic: Claude 3 ---
