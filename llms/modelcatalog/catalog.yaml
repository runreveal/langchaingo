    vendor: google
    api: gemini
    contextWindow: 1000000
    maxOutputTokens: 65536
    reasoning: {style: budget_tokens}
    temperature: true
  - id: gemini-flash-legacy
    match: [gemini-2.0-flash, gemini-1.5-flash]
    vendor: google
    api: gemini
    contextWindow: 1000000
    maxOutputTokens: 8192
    reasoning: {style: none}
    temperature: true
  # Any other Gemini model.
  - id: gemini
    match: [gemini]
    vendor: google
    api: gemini
    contextWindow: 1000000
    reasoning: {style: none}
    temperature: true
