# Model catalog: what langchaingo knows about each model family it calls.
# Adding a model is an edit here, not a new strings.Contains case in a provider.
# See the package doc in catalog.go for how ids are normalized and matched.
#
# Fields:
#   id               canonical name of the family, for logs and tests
#   match            id prefixes, compared after normalization. The longest
#                    match wins, and a prefix only matches at a boundary (end of
#                    id, "-", "@", ":" or "_"), so gpt-5 does not match gpt-5.7.
#   vendor           who makes the model: anthropic | openai | google | amazon
#   api              wire API the model is served by: messages |
#                    chat_completions | responses | gemini | converse
#   contextWindow    input context window, in tokens
#   maxOutputTokens  the model's own output limit, in tokens; 0 when unknown.
#                    Callers that want a smaller product cap apply it on top.
#   reasoning        style: none | budget_tokens | adaptive | effort.
#                    budget_tokens takes thinking.budget_tokens; adaptive takes
#                    thinking.type=adaptive and rejects budget_tokens. efforts
#                    lists the accepted effort levels.
#   temperature      whether non-default sampling parameters (temperature,
#                    top_p, top_k) are accepted
#   pricing          USD per 1M tokens. geoPremium is the fractional uplift on
#                    Bedrock geo inference profiles (us., eu., jp., ...);
#                    global. profiles pay the base rate. longContext, when set,
#                    is the rate for prompts above its threshold.
#
# Claude data: Anthropic models overview and migration guide (October 2026).
# Bedrock geo premiums carried over from runreveal#4326; check them against
# https://aws.amazon.com/bedrock/pricing/ when a price changes.

models:
  # --- Anthropic: Claude 5 ---
  # Fable and Mythos 5.x always think; budget_tokens and sampling params 400.
  - id: claude-fable-5
    match: [claude-fable-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 10, output: 50, geoPremium: 0.10}
  - id: claude-mythos-5
    match: [claude-mythos-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 10, output: 50}
  # Opus 5.5 cannot disable thinking; its default effort is medium.
  - id: claude-opus-5-5
    match: [claude-opus-5-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 4, output: 20, geoPremium: 0.10}
  - id: claude-opus-5
    match: [claude-opus-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 5, output: 25}
  - id: claude-sonnet-5-5
    match: [claude-sonnet-5-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 2, output: 10}
  - id: claude-sonnet-5
    match: [claude-sonnet-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 2, output: 10, geoPremium: 0.10}
  # Haiku 5.5 bills prompts above 100K tokens at the long-context rate.
  - id: claude-haiku-5-5
    match: [claude-haiku-5-5]
    vendor: anthropic
    api: messages
    contextWindow: 1000000
    maxOutputTokens: 128000
    reasoning: {style: adaptive, efforts: [low, medium, high, xhigh, max]}
    temperature: false
    pricing: {input: 0.10, output: 0.50, longContext: {threshold: 100000, input: 0.50, output: 2.50}}

  # --- Anthropic: Claude 4 ---
