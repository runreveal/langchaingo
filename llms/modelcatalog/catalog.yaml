    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 8192
    reasoning: {style: none}
    temperature: true
    pricing: {input: 3, output: 15}
  - id: claude-3-haiku
    match: [claude-3-haiku]
    vendor: anthropic
    api: messages
    contextWindow: 200000
    maxOutputTokens: 4096
    reasoning: {style: none}
    temperature: true
    pricing: {input: 0.25, output: 1.25}

  # --- Amazon Nova (Bedrock) ---
  - id: nova-pro
    match: [nova-pro]
    vendor: amazon
    api: converse
    contextWindow: 300000
    maxOutputTokens: 5000
    reasoning: {style: none}
    temperature: true
    pricing: {input: 0.8, output: 3.2}
  - id: nova-lite
    match: [nova-lite]
    vendor: amazon
    api: converse
