# Mirrors the golangci-lint config used in the runreveal repo.
version: "2"
linters:
  settings:
    govet:
      disable:
        # Reports "cannot inline: type parameter inference is not yet supported" on
        # generic stdlib calls carrying //go:fix inline directives (e.g. slices.Contains).
        # It is a limitation of the analyzer, not a defect in our code.
        - inline
    staticcheck:
      checks:
        - all
        - "-QF*"    # quickfix suggestions — address in follow-up
        - "-ST*"    # style checks — address in follow-up
        - "-SA1019" # deprecated API usage
        - "-SA5008" # json struct tag issues
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - ^examples/
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - ^examples/
